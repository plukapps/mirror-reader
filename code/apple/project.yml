# Proyecto de Xcode de la app de Apple. Se genera con `xcodegen` (ver README.md); el .xcodeproj no va al repo.
name: Reader
options:
  bundleIdPrefix: com.pluk
  createIntermediateGroups: true
  developmentLanguage: es
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ReaderDomain:
    path: Packages/ReaderDomain
targets:
  Reader:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ReaderDomain
    entitlements:
      path: App/Reader.entitlements
      properties:
        # La App Store de Mac exige el sandbox.
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pluk.reader
        PRODUCT_NAME: Reader
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Reader
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        ENABLE_HARDENED_RUNTIME: YES
        # Firma local ("Sign to Run Locally"): no requiere cuenta de Apple Developer.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets: [ReaderTests]
  ReaderTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: Reader
      - package: ReaderDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pluk.reader.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
