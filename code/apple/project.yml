# Proyecto de Xcode de la app de Apple. Se genera con `xcodegen` (ver README.md); el .xcodeproj no va al repo.
name: Reader
options:
  bundleIdPrefix: com.pluk
  createIntermediateGroups: true
  developmentLanguage: es
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ReaderDomain:
    path: Packages/ReaderDomain
  # SDK de Firebase (ADR 0012). Desde la 12.15 exige Swift 6.1 (Xcode 16.3); esta máquina tiene Xcode 16.2.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.14.0
  # Motor de EPUB (ADR 0004, ADR 0013). Solo soporta iOS: en la Mac no se enlaza.
  Readium:
    url: https://github.com/readium/swift-toolkit
    exactVersion: 3.9.0
targets:
  # Un solo target para Mac e iOS (ADR 0010). Lo que es solo de Mac va condicionado con [sdk=macosx*].
  Reader:
    type: application
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
        excludes: [Info.plist, Info-iOS.plist]
    dependencies:
      - package: ReaderDomain
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Readium
        product: ReadiumShared
        destinationFilters: [iOS]
      - package: Readium
        product: ReadiumStreamer
        destinationFilters: [iOS]
      - package: Readium
        product: ReadiumNavigator
        destinationFilters: [iOS]
    # Equipo de firma para iPhone físico; ver Signing.xcconfig.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pluk.reader$(BUNDLE_ID_SUFFIX)
        # En un iPhone físico y en la Mac se firma con el equipo de Signing.local.xcconfig. En la Mac hace falta
        # para el llavero: Firebase Auth guarda ahí la sesión y sin equipo falla con -34018 (ADR 0012).
        "CODE_SIGN_STYLE[sdk=iphoneos*]": Automatic
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        "CODE_SIGN_STYLE[sdk=macosx*]": Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development
        PRODUCT_NAME: Reader
        GENERATE_INFOPLIST_FILE: YES
        # Se combina con lo generado: lleva la cuenta de desarrollo (ver Signing.xcconfig).
        INFOPLIST_FILE: App/Info.plist
        # En iOS, además, el tipo de documento EPUB para "Abrir con" (LIB-001).
        "INFOPLIST_FILE[sdk=iphone*]": App/Info-iOS.plist
        INFOPLIST_KEY_CFBundleDisplayName: Reader
        # La App Store de Mac exige el sandbox (App/Reader.entitlements).
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/Reader.entitlements
        "INFOPLIST_KEY_LSApplicationCategoryType[sdk=macosx*]": public.app-category.books
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # iOS: solo iPhone por ahora (iPad corre en modo compatible), pantalla de arranque vacía.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Firma local ("Sign to Run Locally"): no requiere cuenta de Apple Developer.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        # La cuenta de desarrollo nunca viaja en un build Release.
        Release:
          DEV_ACCOUNT_EMAIL: ""
          DEV_ACCOUNT_PASSWORD: ""
    scheme:
      testTargets: [ReaderTests]
  ReaderTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources: [Tests]
    dependencies:
      - target: Reader
      - package: ReaderDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pluk.reader.tests
        TARGETED_DEVICE_FAMILY: "1"
        # Con varios destinos XcodeGen arma la ruta de iOS; en la Mac el ejecutable está en Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Reader.app/Contents/MacOS/Reader
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
